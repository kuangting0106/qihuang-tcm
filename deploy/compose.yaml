name: qihuang-tcm

services:
  web:
    image: caddy:2-alpine
    container_name: qihuang-tcm-web
    restart: unless-stopped
    ports:
      - "${QIHUANG_PORT:-8081}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./site:/srv:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    image: node:22-alpine
    container_name: qihuang-tcm-api
    restart: unless-stopped
    working_dir: /app
    command: ["node", "notes-server.mjs"]
    environment:
      QIHUANG_API_PORT: "8787"
      QIHUANG_DATA_FILE: "/data/notes.json"
      QIHUANG_EDIT_KEY: "${QIHUANG_EDIT_KEY:-change-me}"
    volumes:
      - ./server:/app:ro
      - ./data:/data
    expose:
      - "8787"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8787/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
